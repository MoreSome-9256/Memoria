AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cognito-protected API proxy for Memoria.
Parameters:
  AwsRegion:
    Type: String
    Default: ap-southeast-1
  CognitoUserPoolId:
    Type: String
  CognitoAppClientId:
    Type: String
  AllowedOrigins:
    Type: String
    Default: '*'
  SecretId:
    Type: String
    Default: ''
    Description: Optional Secrets Manager secret id containing provider tokens.
  LlmBaseUrl:
    Type: String
    Default: https://api.deepseek.com/v1
  LlmModel:
    Type: String
    Default: deepseek-chat
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Architectures:
    - arm64
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        SECRET_ID:
          Ref: SecretId
        LLM_BASE_URL:
          Ref: LlmBaseUrl
        LLM_MODEL:
          Ref: LlmModel
        ALLOWED_ORIGINS:
          Ref: AllowedOrigins
Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - Ref: AllowedOrigins
        AllowHeaders:
        - authorization
        - content-type
        AllowMethods:
        - GET
        - POST
        - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: 
                  https://cognito-idp.${AwsRegion}.amazonaws.com/${CognitoUserPoolId}
              audience:
              - Ref: CognitoAppClientId
  ProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://memoria-api-proxy-dev-artifacts-625847798892-ap-northeast-2/be6d1f2f7ece4123767b728f22bb5be8
      Handler: src/index.handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - Statement:
          Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource: '*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: Api
            Path: /{proxy+}
            Method: ANY
Outputs:
  ApiUrl:
    Description: Base URL for the protected proxy.
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com
