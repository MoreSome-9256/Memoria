org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
# 1. 强制当前项目使用 F 盘的 Gradle 缓存
gradle.user.home=F:/.gradle

# 2. 强制把编译时的 Java 临时文件夹也挪到 F 盘（彻底拯救 C 盘）
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Djava.io.tmpdir=F:/temp