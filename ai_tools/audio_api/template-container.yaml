AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memoria Audio Analysis API - Docker Container Deployment to Lambda & ECR

Parameters:
  ImageUri:
    Type: String
    Description: ECR Image URI for the Lambda function
    Default: ''
  ContainerPort:
    Type: Number
    Default: 8000
    Description: Container internal port

Conditions:
  UseECR: !Not [!Equals [!Ref ImageUri, '']]

Resources:
  # ECR Repository for storing container images
  AudioApiRegistry:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: memoria-librosa-api
      ImageScanningConfiguration:
        ScanOnPush: false
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: Memoria
        - Key: Service
          Value: AudioAnalysis

  # Lambda Function with Container Image
  LibrosaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: memoria-librosa-function
      PackageType: Image
      ImageUri: !If 
        - UseECR
        - !Ref ImageUri
        - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AudioApiRegistry}:latest'
      Architectures:
        - x86_64
      MemorySize: 3008  # 最大内存，librosa需要大量内存
      Timeout: 900      # 15分钟超时
      EphemeralStorage:
        Size: 10240     # 10GB临时存储
      Environment:
        Variables:
          PYTHONUNBUFFERED: 'true'
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref AudioAnalysisApi
            Path: /{proxy+}
            Method: ANY
      Tags:
        - Key: Project
          Value: Memoria
        - Key: Service
          Value: AudioAnalysis

  # HTTP API Gateway
  AudioAnalysisApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: memoria-audio-api
      Description: Memoria Audio Analysis REST API
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'
      Tags:
        Project: Memoria
        Service: AudioAnalysis

  # CloudWatch Log Group
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${LibrosaFunction}'
      RetentionInDays: 7

  # IAM Role for Lambda (如需要S3访问等)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: Memoria

  # 可选：S3 Bucket用于上传音频文件
  AudioStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'memoria-audio-storage-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldUploads
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      Tags:
        - Key: Project
          Value: Memoria

  # S3 Bucket Policy (允许Lambda访问)
  AudioStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioStorageBucket
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub '${AudioStorageBucket.Arn}/*'

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint
    Value: !Sub 'https://${AudioAnalysisApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LibrosaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt AudioApiRegistry.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-ECRUri'

  S3BucketName:
    Description: S3 Bucket for audio storage
    Value: !Ref AudioStorageBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
