# Prometheus configuration for Memoria Audio API monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'memoria-audio-api'

scrape_configs:
  - job_name: 'librosa-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['librosa-api:8000']
    scrape_interval: 10s
    scrape_timeout: 5s
